<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #111; font-family: Arial, sans-serif; }
      .storyboard { position: relative; width: 1280px; height: 720px; overflow: hidden; isolation: isolate; }
      .storyboard img { display: block; }
      .hero { display: grid; grid-template-columns: 44% 30% 26%; gap: 2px; padding: 28px; background: #1b315c; }
      .hero::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 45% 42%, rgba(242,156,24,.28), transparent 36%); z-index: -1; }
      .hero figure { margin: 0; overflow: hidden; background: #ece9e3; }
      .hero figure:first-child { border-radius: 26px 0 0 26px; }
      .hero figure:last-child { border-radius: 0 26px 26px 0; }
      .hero figure img { width: 100%; height: 100%; object-fit: contain; }
      .house { display: grid; grid-template-columns: 58% 42%; background: #f3f0e9; }
      .house .alsamah { position: relative; padding: 44px; display: grid; grid-template-columns: 44% 56%; align-items: stretch; }
      .house .alsamah-logo { width: 88%; height: 180px; object-fit: contain; align-self: center; }
      .house .product { width: 100%; height: 632px; object-fit: contain; align-self: center; }
      .house .elko { position: relative; display: grid; place-items: center; background: #050505; }
      .house .elko img { width: 84%; height: 68%; object-fit: contain; }
      .pack { padding: 44px 54px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; gap: 10px; background: #efeae1; }
      .pack::before { content: ""; position: absolute; width: 650px; height: 650px; left: 315px; top: 36px; border-radius: 50%; background: #f29c18; opacity: .18; z-index: -1; }
      .pack img { width: 100%; height: 590px; object-fit: contain; filter: drop-shadow(0 24px 30px rgba(22,33,60,.14)); }
    </style>
  </head>
  <body>
    <section class="storyboard hero" id="hero">
      <figure><img src="../public/assets/lifestyle/round-neck-navy-worn.png" alt="" /></figure>
      <figure><img src="../public/assets/lifestyle/body-offwhite-worn.png" alt="" /></figure>
      <figure><img src="../public/assets/generated/colors/collants-brillants-ete-dayana-bleu-marine.png" alt="" /></figure>
    </section>
    <section class="storyboard house" id="house">
      <div class="alsamah"><img class="alsamah-logo" src="../public/assets/brand/alsamah-lockup.png" alt="" /><img class="product" src="../public/assets/products/body-black.png" alt="" /></div>
      <div class="elko"><img src="../public/assets/brand/elko-logo-transparent.png" alt="" /></div>
    </section>
    <section class="storyboard pack" id="pack">
      <img src="../public/assets/generated/colors/collants-brillants-ete-dayana-noir.png" alt="" />
      <img src="../public/assets/products/body-offwhite.png" alt="" />
      <img src="../public/assets/products/round-neck-navy.png" alt="" />
      <img src="../public/assets/official/striped-shorts.png" alt="" />
    </section>
  </body>
</html>
